name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci is skipped in favor of npm install: the lockfile was generated
      # on macOS ARM and npm has a known bug (npm/cli#4828) resolving
      # platform-specific optional dependencies (rolldown's native binding)
      # for a different OS/arch than the one the lockfile came from.
      - run: npm install
      - run: npm run build-storybook --workspace=northline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/northline/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
